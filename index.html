<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>대결 블록</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="대결 블록">
<meta name="theme-color" content="#14162e">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e9f7; --panel:#ffffff; --ink:#1c1e3a; --muted:#61648a; --line:#d3d6ee;
  --well:#202447; --dot:#3a3f6e; --p1:#ff4f8b; --p2:#19b6d4; --warn:#ff5a3c; --gold:#ffc53d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14162e; --panel:#1d2044; --ink:#eef0ff; --muted:#9a9ec9; --line:#2e3263;
    --well:#0e1028; --dot:#262a55;
  }
}
:root[data-theme="dark"]{
  --bg:#14162e; --panel:#1d2044; --ink:#eef0ff; --muted:#9a9ec9; --line:#2e3263;
  --well:#0e1028; --dot:#262a55;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  -webkit-user-select:none; user-select:none; touch-action:none;
  overflow:hidden; -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.disp{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}

/* 기본: 세로 폰을 눕혀 놓고 위·아래 끝에서 마주 보는 배치 */
.app{height:100%;display:flex;flex-direction:column;gap:4px;padding:4px 6px}
.player{--pc:var(--p1);position:relative;flex:1;min-height:0;display:grid;
  grid-template-columns:var(--side,88px) auto var(--side,88px);
  gap:4px;background:var(--panel);border-radius:16px;padding:8px;justify-content:center}
#p1{transform:rotate(180deg)}
#p2{--pc:var(--p2)}
body.vscpu #p1{transform:none}
body.vscpu #p1 .ctrl, body.vscpu #p1 .rctrl{visibility:hidden}
@media (pointer:coarse){ .player{padding:6px;gap:3px} .pads{gap:4px} }

/* 혼자 하는 모드(컴퓨터·정복·온라인): 상대 2 : 나 8 */
body.vscpu:not(.desk) #p1{flex:.25}
body.vscpu #p1 .ctrl, body.vscpu #p1 .rctrl{display:none}
/* 상대 작은 화면은 정보 간단히 */
body.vscpu:not(.desk) #p1 .face{width:34px;height:34px;margin-bottom:1px}
body.vscpu:not(.desk) #p1 .pname{font-size:14px}
body.vscpu:not(.desk) #p1 .cname{font-size:11px}
body.vscpu:not(.desk) #p1 .lines, body.vscpu:not(.desk) #p1 .wins{font-size:10px}
body.vscpu:not(.desk) #p1 .status{min-height:0;font-size:10px}
body.vscpu:not(.desk) #p1 .info{gap:1px}

/* 터치 기기: 판 양옆 기둥에 버튼 3개씩 세로로
   왼쪽 [필살기, ◀, ↻] / 오른쪽 [▼, ▶, ⇊] */
.player.colbtn .side{justify-content:flex-start}
.player.colbtn .ctrl, .player.colbtn .rctrl{margin-top:auto;gap:var(--bg,10px)}
.player.colbtn .ctrl > .pad, .player.colbtn .rctrl > .pad{width:100%;height:var(--bh,58px);font-size:calc(var(--bh,58px)*.4);padding:0;flex:none;grid-column:auto}
.player.colbtn .pad.sp{font-size:calc(var(--bh,58px)*.3)}
.player.colbtn .pad.sp .spn{display:none}
.player.colbtn .cname{white-space:normal;line-height:1.2}
.player.colbtn .face{width:44px;height:44px}
.player.colbtn .pname{font-size:16px}
.player.colbtn .cname{font-size:11px}
.player.loser{opacity:.75}

.side{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.info{display:flex;flex-direction:column;gap:2px;min-width:0}
.pname{color:var(--pc);font-size:20px;line-height:1}
.cname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.cname svg{flex:none;border-radius:50%}
.face{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--pc);margin-bottom:3px;flex:none}
.face svg{display:block;width:100%;height:100%;border-radius:50%}
.face.bump{animation:bump .5s}
.face.jolt{animation:jolt .45s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes jolt{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-5deg)}40%{transform:translateX(4px) rotate(5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.lines,.wins{font-size:12px;color:var(--muted)}
.wins b{color:var(--ink);font-size:14px}
.gauge{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.gauge i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.gauge.full i{background:linear-gradient(90deg,var(--gold),var(--pc))}
.status{font-size:12px;min-height:16px;font-weight:700;color:var(--pc)}
.nextbox{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--muted)}
.next{display:block;border-radius:6px;background:var(--well)}

.ctrl,.rctrl{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--lift,0px)}
.pk-opts.one{grid-template-columns:1fr}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pad{border:0;border-radius:14px;font-size:22px;height:62px;touch-action:none;
  background:color-mix(in srgb,var(--pc) 18%,var(--panel));color:var(--ink)}
.pad.big{grid-column:1 / -1;height:70px;font-size:28px}
.pad.on,.pad:active{background:color-mix(in srgb,var(--pc) 50%,var(--panel))}
.pad.sp{position:relative;overflow:hidden;height:50px;font-size:15px;font-weight:700;
  background:var(--line);color:var(--muted)}
.pad.sp .fill{position:absolute;left:0;bottom:0;top:0;width:0;background:color-mix(in srgb,var(--gold) 45%,transparent);transition:width .2s}
.pad.sp span{position:relative}
.pad.sp.ready{color:#1c1e3a;background:var(--gold);animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 var(--gold)}to{box-shadow:0 0 14px 2px var(--gold)}}
@media (max-height:700px){.pad{height:52px}.pad.big{height:58px}.pad.sp{height:44px}}

.board-wrap{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.gbar{width:6px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.gbar i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--warn);transition:height .2s}
.board{display:block;border-radius:8px}
.board-wrap.shake .board{animation:shake .25s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;text-align:center;color:#fff;text-shadow:0 2px 0 var(--pc),0 0 14px var(--pc)}
.msg .big{font-size:48px;line-height:1.1}
.msg .sm{font-size:15px;margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.6);font-family:'Noto Sans KR',sans-serif;font-weight:700}
.msg .pulse{animation:cd .7s}
@keyframes cd{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.pop{position:absolute;left:50%;top:38%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;
  font-size:22px;color:#fff;text-shadow:0 2px 0 var(--pc),0 0 12px var(--pc);animation:pop 1s forwards;z-index:2}
@keyframes pop{from{opacity:1;transform:translate(-50%,0) scale(1.15)}to{opacity:0;transform:translate(-50%,-44px) scale(1)}}

/* 캐릭터 선택 (각자 판 위에 자기 방향으로 표시) */
.picker{position:absolute;inset:0;z-index:5;background:var(--panel);border-radius:16px;padding:10px;
  display:flex;flex-direction:column;gap:7px;overflow:auto;touch-action:pan-y}
.picker.hidden{display:none}
.pk-head{font-size:18px;color:var(--pc)}
.pk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.ch{border:2px solid transparent;border-radius:12px;background:var(--bg);padding:5px 2px;
  display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700}
.ch{position:relative;font-size:11px;white-space:normal;word-break:keep-all;text-align:center;line-height:1.15}
.ch svg{display:block;border-radius:50%}
.ch .fl{position:absolute;top:2px;right:3px;font-size:12px;line-height:1}
.ch small{font-weight:400;color:var(--muted);font-size:10px}
.pk-who{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pk-who svg{flex:none;border-radius:50%}
.pk-who .sub{font-size:11px;color:var(--muted)}
.msg svg{border-radius:50%;box-shadow:0 0 0 3px var(--pc)}
.ch.sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--bg))}
.pk-info{font-size:12px;line-height:1.55;background:var(--bg);border-radius:10px;padding:8px 10px;flex:1;min-height:max-content}
.pk-info b{font-size:14px}
.pk-info .k{color:var(--pc);font-weight:700}
.pk-name{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;font-weight:700;color:var(--muted)}
.pk-name input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;
  color:var(--ink);background:var(--panel);-webkit-user-select:text;user-select:text;touch-action:manipulation}
.pk-name input:focus{outline:2px solid var(--pc);border-color:transparent}
.pk-back{background:transparent;color:var(--pc);border:1.5px solid var(--pc)}
.pk-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.opt{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:700;min-width:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 2px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--pc);color:#fff}
.opt small{font-weight:400;font-size:10px}
.pk-go{border:0;border-radius:12px;padding:11px;font-weight:700;font-size:15px;background:var(--pc);color:#fff;flex:none}
.pk-wait{font-size:14px;color:var(--muted);text-align:center;padding:10px}

.mid{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:40px}
.mid .lv{font-size:12px;font-weight:700;color:var(--muted);min-width:40px;text-align:center}
.mid .lv.top{transform:rotate(180deg)}
body.vscpu .mid .lv.top{visibility:hidden}
.mid button{height:36px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px}
.keys{display:none}
.mid button.ic{width:36px;padding:0;font-size:16px}
.mid button.ic.off{opacity:.35;text-decoration:line-through}

/* 넓은 화면 + 마우스(PC): 좌우 나란히, 뒤집지 않음 */
body.desk .app{flex-direction:row;max-width:1040px;margin:0 auto;padding:10px}
body.desk #p1{transform:none}
body.desk .mid{flex-direction:column;height:auto;width:76px}
body.desk .mid .lv.top{display:none}
body.desk .pads, body.desk .pad.sp{display:none}
body.desk .keys{display:block;font-size:11px;color:var(--muted);line-height:1.6}
body.desk .keys b{color:var(--ink)}
body.desk.vscpu #p1 .keys{display:none}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;
  background:color-mix(in srgb,var(--bg) 40%,transparent)}
.overlay.hidden{display:none}
.card{background:var(--panel);border-radius:20px;padding:18px;max-width:360px;width:100%;text-align:center;max-height:calc(100dvh - 40px);overflow:auto;touch-action:pan-y;
  box-shadow:0 18px 50px -16px rgba(20,22,60,.55)}
.credit{text-align:center;font-size:8px;font-weight:400;margin-top:12px;color:var(--muted);letter-spacing:.2px}
.card h1{font-size:32px;margin:0 0 4px;letter-spacing:-1px}
.card h1 .a{color:var(--p1)} .card h1 .b{color:var(--p2)}
.card p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
.card .mirror{transform:rotate(180deg);color:var(--muted);font-size:13px;margin-bottom:10px}
body.desk .card .mirror, body.vscpu .card .mirror{display:none}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--ink);color:var(--panel)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;text-align:left}
.mode b{display:block;font-size:16px}
.mode span{font-size:12px;color:var(--muted)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.lvb{border:0;border-radius:10px;height:44px;font-weight:700;font-size:16px;
  background:color-mix(in srgb,var(--c) 22%,var(--bg))}
.lvb.sel{background:var(--c);color:#fff}
.cq-prog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:0 0 10px}
.cq-prog .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.cq-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--warn))}
.cq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.cq{position:relative;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:7px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;word-break:keep-all;line-height:1.15}
.cq svg{border-radius:50%}
.cq small{font-weight:400;color:var(--muted);font-size:10px}
.cq:not(.done){border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.cq.done{opacity:.55}
.cq.done::after{content:'정복';position:absolute;top:28%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
  font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:18px;color:#e5383b;border:2.5px solid #e5383b;
  border-radius:8px;padding:0 6px;background:color-mix(in srgb,var(--panel) 75%,transparent)}
.cq-me{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.cq-me svg{border-radius:50%}
.lb-list{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto;margin-bottom:10px;text-align:left}
.lb-room{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);
  border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;text-align:left}
.lb-room small{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.lb-room.full{opacity:.5}
.lb-empty{color:var(--muted);font-size:13px;text-align:center;padding:14px;line-height:1.6;border:1px dashed var(--line);border-radius:12px}
.lb-form,.lb-join{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.lb-join{background:var(--bg);border-radius:12px;padding:10px}
.lb-join.hidden{display:none}
.lb-jt{font-weight:700;font-size:14px;text-align:left}
.lb-form input,.lb-join input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;
  color:var(--ink);background:var(--panel);-webkit-user-select:text;user-select:text;touch-action:manipulation}
.lb-form input:focus,.lb-join input:focus{outline:2px solid var(--p2);border-color:transparent}
.lb-stat{font-size:11px;font-weight:700;color:var(--muted);text-align:left;margin-bottom:6px}
.lb-stat.ok{color:#2a9d6a} .lb-stat.bad{color:var(--warn)}
.lb-msg{min-height:18px;font-size:13px;font-weight:700;color:var(--warn);margin-bottom:6px}
.lvdesc{font-size:13px;font-weight:700;margin-bottom:14px;min-height:20px}
/* 태블릿(터치 + 넓은 화면): 버튼 크게 */
@media (pointer:coarse) and (min-width:700px){
  .pad{height:88px;font-size:30px;border-radius:18px}
  .pad.big{height:100px;font-size:38px}
  .pad.sp{height:66px;font-size:18px}
  .pads{gap:8px}
  .face{width:68px;height:68px}
  .pname{font-size:26px} .cname{font-size:16px}
  .player.colbtn .pad.sp .spn{display:inline}
  .player.colbtn .pad.sp{font-size:calc(var(--bh,58px)*.2);white-space:nowrap}
  .player.colbtn .face{width:68px;height:68px}
  body.vscpu:not(.desk) #p1 .face{width:48px;height:48px}
  body.vscpu:not(.desk) #p1 .pname{font-size:18px} body.vscpu:not(.desk) #p1 .cname{font-size:13px}
  .player.colbtn .pname{font-size:24px} .player.colbtn .cname{font-size:15px} .lines,.wins,.status{font-size:14px}
  .pk-grid{gap:8px} .ch{font-size:13px;padding:8px 2px} .pk-info{font-size:14px} .pk-go{padding:15px;font-size:17px}
  .opt{font-size:13px} .pk-name{font-size:13px} .pk-name input{font-size:17px;padding:10px 12px} .seg button{font-size:15px;padding:11px 4px} .opt small{font-size:12px}
  .mid{height:52px} .mid button{height:44px;font-size:16px} .mid button.ic{width:44px;font-size:20px}
}
/* 터치 기기를 가로로 들면 세로로 돌려달라고 안내 */
.rotate{display:none}
@media (pointer:coarse) and (orientation:landscape){
  .rotate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:var(--bg);text-align:center;padding:20px}
  .rotate .ico{font-size:56px;animation:tilt 1.6s ease-in-out infinite}
  .rotate b{font-size:20px} .rotate span{font-size:14px;color:var(--muted);line-height:1.6}
}
@keyframes tilt{0%,100%{transform:rotate(90deg)}50%{transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="player" id="p1">
    <div class="side">
      <div class="info">
        <div class="face"></div>
        <span class="pname disp">P1</span><span class="cname"></span>
        <span class="lines">0줄</span><span class="wins">승 <b>0</b></span>
        <div class="gauge"><i></i></div><span class="status"></span>
      </div>
      <div class="keys"><b>A D</b> 이동<br><b>W</b> 회전<br><b>S</b> 내리기<br><b>Space</b> 즉시낙하<br><b>E</b> 필살기</div>
      <div class="ctrl">
        <button class="pad sp" data-a="S"><i class="fill"></i><span>필살기</span></button>
        <div class="pads"><button class="pad" data-a="L" aria-label="왼쪽">◀</button><button class="pad" data-a="R" aria-label="오른쪽">▶</button></div>
      </div>
    </div>
    <div class="board-wrap"><div class="gbar"><i></i></div><canvas class="board"></canvas><div class="msg disp"></div></div>
    <div class="side">
      <div class="nextbox">다음<canvas class="next"></canvas></div>
      <div class="rctrl"><div class="pads">
        <button class="pad big" data-a="U" aria-label="회전">↻</button>
        <button class="pad" data-a="D" aria-label="내리기">▼</button><button class="pad" data-a="H" aria-label="즉시 낙하">⇊</button>
      </div></div>

  const fx={
    rotate(){ tone(now(),900,0.04,{type:'triangle',vol:0.05}); },
    drop(){ const t=now(); tone(t,190,0.12,{type:'sine',vol:0.35,to:60}); noise(t,0.06,{vol:0.1,from:2000,to:200}); },
    clear(n){ const t=now(); [72,76,79,84,88].slice(0,Math.min(5,n+1)).forEach((m,i)=>tone(t+i*0.045,N(m),0.14,{vol:0.08})); },
    // 공격 세기별: 약(1~2) 레이저 / 중(3~4) 이중 사격 / 강(5~6) 폭발 / 초강(7+) 2차 폭발
    attack(a){
      const t=now()+0.1;
      if(a<=2){
        tone(t,1500,0.18,{vol:0.12,to:320});
      }else if(a<=4){
        tone(t,1900,0.22,{type:'sawtooth',vol:0.12,to:220});
        tone(t+0.09,1700,0.22,{vol:0.1,to:190});
        noise(t+0.05,0.28,{vol:0.22,from:6000,to:400});
      }else{
        tone(t,2300,0.3,{type:'sawtooth',vol:0.13,to:150});
        noise(t,0.65,{vol:0.45,from:8000,to:110});
        tone(t+0.05,150,0.75,{type:'sine',vol:0.6,to:34});
        tone(t+0.05,75,0.7,{vol:0.12,to:30});
        [69,72,76,81].forEach((m,i)=>tone(t+0.15+i*0.06,N(m),0.35,{vol:0.07}));
        if(a>=7){ noise(t+0.38,0.55,{vol:0.32,from:3000,to:80}); tone(t+0.38,110,0.65,{type:'sine',vol:0.5,to:28}); }
      }
    },
    hit(n){ const t=now(); tone(t,130,0.25+Math.min(n,8)*0.03,{vol:0.14,to:45}); noise(t,0.22,{vol:0.22,from:1500,to:100}); },
    block(){ const t=now(); tone(t,1320,0.3,{type:'triangle',vol:0.15}); tone(t,1980,0.25,{type:'sine',vol:0.08}); },
    special(){ const t=now(); tone(t,200,0.5,{type:'sawtooth',vol:0.1,to:1600});
      [72,76,79,84,88].forEach((m,i)=>tone(t+0.3+i*0.05,N(m),0.3,{type:'triangle',vol:0.1}));
      noise(t+0.3,0.4,{vol:0.12,from:9000,to:2000}); },
    count(){ tone(now(),N(69),0.12,{vol:0.12}); },
    go(){ tone(now(),N(81),0.32,{vol:0.14}); },
    win(){ const t=now(); [72,76,79,84].forEach((m,i)=>tone(t+i*0.12,N(m),i===3?0.6:0.14,{vol:0.12})); },
    lose(){ const t=now(); [67,63,60,55].forEach((m,i)=>tone(t+i*0.18,N(m),0.26,{type:'triangle',vol:0.15})); },
  };
  const sfx={};
  Object.keys(fx).forEach(k=>sfx[k]=(...a)=>{ if(!sfxOn||!ensure()) return; try{ fx[k](...a); }catch(_){} });

  /* 배경음악: 러시아 민요 '코로베이니키'(1861, 저작권 만료) 칩튠 편곡 */
  const A=[[76,1],[71,.5],[72,.5],[74,1],[72,.5],[71,.5],[69,1],[69,.5],[72,.5],[76,1],[74,.5],[72,.5],
    [71,1.5],[72,.5],[74,1],[76,1],[72,1],[69,1],[69,1],[0,1],
    [0,.5],[74,1],[77,.5],[81,1],[79,.5],[77,.5],[76,1.5],[72,.5],[76,1],[74,.5],[72,.5],
    [71,1],[71,.5],[72,.5],[74,1],[76,1],[72,1],[69,1],[69,1],[0,1]];
  const B=[[76,2],[72,2],[74,2],[71,2],[72,2],[69,2],[68,2],[71,2],[76,2],[72,2],[74,2],[71,2],[72,1],[76,1],[81,2],[80,4]];
  const BASS_A=[40,45,44,45,50,48,44,45], BASS_B=[45,44,45,44,45,44,45,44];
  const ev=[]; let beat=0;
  function addMel(mel){ for(const [m,d] of mel){ if(m) ev.push({b:beat,m,d,v:0}); beat+=d; } }
  function addBass(roots,start){ roots.forEach((r,bar)=>{ for(let i=0;i<8;i++) ev.push({b:start+bar*4+i*.5,m:i%2?r+12:r,d:.45,v:1}); }); }
  addBass(BASS_A,0); addMel(A); addBass(BASS_A,32); addMel(A); addBass(BASS_B,64); addMel(B);
  const TOTAL=beat; ev.sort((x,y)=>x.b-y.b);
  let idx=0, curBeat=0, curTime=0, timer=null, bpm=140, playing=false;
  function sched(){
    const spb=60/bpm, ahead=ctx.currentTime+0.18;
    while(true){
      const e=ev[idx], t=curTime+(e.b-curBeat)*spb;
      if(t>ahead) break;
      if(t>=ctx.currentTime-0.02){
        if(e.v===0) note(t,N(e.m),e.d*spb*0.92,'square',0.11);
        else note(t,N(e.m),e.d*spb,'triangle',0.28);
      }
      curBeat=e.b; curTime=t; idx++;
      if(idx>=ev.length){ idx=0; curBeat-=TOTAL; }
    }
  }
  const music={
    reset(){ idx=0; curBeat=0; bpm=140; },
    start(){
      if(!ensure()||playing) return; playing=true;
      curTime=ctx.currentTime+0.05; curBeat=ev[idx].b;
      timer=setInterval(sched,30); sched();
    },
    stop(){ playing=false; clearInterval(timer); timer=null; },
    tempo(lvl){ bpm=Math.min(210,140+(lvl-1)*7); },
    _events:ev, _total:TOTAL,
  };
  return {
    ensure, sfx, music,
    get bgmOn(){ return bgmOn; }, get sfxOn(){ return sfxOn; },
    toggleBgm(){ bgmOn=!bgmOn; save('bd_bgm',bgmOn); if(ensure()) musicBus.gain.setTargetAtTime(bgmOn?0.3:0,ctx.currentTime,0.03); return bgmOn; },
    toggleSfx(){ sfxOn=!sfxOn; save('bd_sfx',sfxOn); if(ensure()) sfxBus.gain.setTargetAtTime(sfxOn?0.85:0,ctx.currentTime,0.03); return sfxOn; },
  };
})();
const SFX=Snd.sfx, Music=Snd.music;
/* 전체화면: 게임을 시작하는 버튼을 누를 때 자동으로 들어감 */
const FS={
  el:document.documentElement,
  can(){ return !!(this.el.requestFullscreen||this.el.webkitRequestFullscreen); },
  is(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); },
  enter(){
    try{
      if(this.is()||!this.can()) return;
      const r=(this.el.requestFullscreen||this.el.webkitRequestFullscreen).call(this.el,{navigationUI:'hide'});
      const lock=()=>{ try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{}); }catch(_){} };
      if(r&&r.then) r.then(lock).catch(()=>{}); else lock();
    }catch(_){}
  },
  exit(){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(_){} },
  toggle(){ this.is()?this.exit():this.enter(); }
};
const Wake=(()=>{ let lock=null;
  return {
    async on(){ try{ if(!lock&&navigator.wakeLock){ lock=await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>{lock=null;}); } }catch(_){ lock=null; } },
    off(){ try{ if(lock) lock.release(); }catch(_){} lock=null; }
  };
})();
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>Snd.ensure(),{passive:true}));

  return d;
}

function esc(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loadNames(id){ try{ return JSON.parse(localStorage.getItem('bd_names_'+id)||'{}')||{}; }catch(_){ return {}; } }

/* ===== 플레이어 ===== */
class Player{
  constructor(id,root){
    this.id=id; this.root=root;
    this.cv=root.querySelector('.board'); this.ctx=this.cv.getContext('2d');
    this.nv=root.querySelector('.next'); this.nctx=this.nv.getContext('2d');
    this.wrap=root.querySelector('.board-wrap');
    this.gbar=root.querySelector('.gbar'); this.gfill=root.querySelector('.gbar i');
    this.linesEl=root.querySelector('.lines'); this.winsEl=root.querySelector('.wins b');
    this.msgEl=root.querySelector('.msg'); this.nameEl=root.querySelector('.pname'); this.cnameEl=root.querySelector('.cname');
    this.gaugeEl=root.querySelector('.gauge'); this.gaugeFill=root.querySelector('.gauge i');
    this.statusEl=root.querySelector('.status'); this.spBtn=root.querySelector('.pad.sp');
    this.spFill=this.spBtn.querySelector('.fill'); this.spLabel=this.spBtn.querySelector('span');
    this.picker=root.querySelector('.picker');
    this.faceEl=root.querySelector('.face'); this.curMood=null; this.moodT=null;
    this.sides=root.querySelectorAll(':scope > .side');
    this.ctrlEl=root.querySelector('.ctrl'); this.rctrlEl=root.querySelector('.rctrl');
    this.padL=this.ctrlEl.querySelector('.pads'); this.padR=this.rctrlEl.querySelector('.pads');
    this.btn={}; root.querySelectorAll('.pad[data-a]').forEach(b=>this.btn[b.dataset.a]=b);
    this.opt=loadOpt(id); this.applyOpt(); this.names=loadNames(id);
    this.ch=CHARS[0]; this.cs=16; this.statusTxt=''; this.reset();
  }
  applyOpt(){
    const [ls,rs]=this.sides, b=this.btn, L=this.ctrlEl, R=this.rctrlEl;
    const desk=document.body.classList.contains('desk');
    const solo=document.body.classList.contains('vscpu')&&this.id===1;
    const col=!desk&&!solo;
    this.root.classList.toggle('colbtn',col);
    if(col){ L.replaceChildren(b.S,b.L,b.U); R.replaceChildren(b.D,b.R,b.H); }
    else{
      this.padL.replaceChildren(b.L,b.R); this.padR.replaceChildren(b.U,b.D,b.H);
      L.replaceChildren(b.S,this.padL); R.replaceChildren(this.padR);
    }
    ls.appendChild(L); rs.appendChild(R);
  }
  // 표정: 'normal' | 'happy'(공격 성공) | 'shock'(공격 받음). ms가 있으면 그 뒤 기본 표정으로 돌아감
  mood(m,ms){
    clearTimeout(this.moodT);
    if(this.curMood!==m){ this.curMood=m; this.faceEl.innerHTML=avatar(this.ch,48,m); }
    if(m!=='normal'){
      const c=m==='shock'?'jolt':'bump';
      this.faceEl.classList.remove('bump','jolt'); void this.faceEl.offsetWidth; this.faceEl.classList.add(c);
    }
    if(ms) this.moodT=setTimeout(()=>this.mood('normal'),ms);
  }
  nameFor(cid){ const n=(this.names[cid]||'').trim(); return n||CMAP[cid].name; }
  dispName(){ if(this.remote) return this.remoteName||this.ch.name; return (mode==='cpu'&&this.id===1) ? this.ch.name : this.nameFor(this.ch.id); }
  // 온라인: 내 판 상태를 상대에게 보내는 요약본
  snap(){
    return {g:this.grid.map(r=>r.map(v=>v||'.').join('')).join(''),
      c:this.cur?{t:this.cur.t,m:this.cur.m,x:this.cur.x,y:this.cur.y}:null,
      qi:this.qi, f:this.forced.slice(0,1), p:this.pending, ga:this.gauge, l:this.lines,
      sh:this.shieldT|0, fe:this.feverT|0, bl:this.blindT|0, ha:this.hasteT|0, re:this.reflectT|0, fr:this.freezeT|0,
      ba:this.bank, fo:this.forced.length, mo:this.curMood||'normal', d:this.dead};
  }
  applySnap(s){
    if(!s||typeof s.g!=='string') return;
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){ const v=s.g[y*COLS+x]; this.grid[y][x]=(v&&v!=='.')?v:null; }
    this.cur=s.c&&SHAPES[s.c.t]?{t:s.c.t,m:s.c.m,x:s.c.x,y:s.c.y}:null;
    this.qi=s.qi|0; this.forced=(s.f||[]).concat(Array(Math.max(0,(s.fo|0)-1)).fill('I'));
    this.pending=s.p|0; this.gauge=s.ga|0; this.lines=s.l|0; this.bank=s.ba|0;
    this.shieldT=s.sh|0; this.feverT=s.fe|0; this.blindT=s.bl|0; this.hasteT=s.ha|0; this.reflectT=s.re|0; this.freezeT=s.fr|0;
    if(s.mo&&s.mo!==this.curMood) this.mood(s.mo);
    this.status(); this.updateHud();
  }
  saveNames(){ try{ localStorage.setItem('bd_names_'+this.id,JSON.stringify(this.names)); }catch(_){} }
  saveOpt(){ try{ localStorage.setItem('bd_opt_'+this.id,JSON.stringify(this.opt)); }catch(_){} }
  setChar(ch){
    this.ch=ch;
    this.cnameEl.innerHTML=`<span>${ch.flag} ${esc(this.dispName())}</span>`;
    this.curMood=null; this.mood('normal');
    this.spLabel.innerHTML=`${ch.emo}<span class="spn"> ${ch.spName}</span>`;
  }
  reset(){
    this.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    this.qi=0; this.pending=0; this.lines=0; this.combo=0; this.dead=false;
    this.drop=0; this.lockT=0; this.lockN=0; this.cur=null; this.flashT=0;
    this.gauge=0; this.shieldT=0; this.feverT=0; this.blindT=0; this.hasteT=0;
    this.reflectT=0; this.freezeT=0; this.bank=0; this.forced=[];
    this.root.classList.remove('loser'); this.say('');
    if(this.faceEl&&this.curMood!==null) this.mood('normal');
    this.updateHud();
  }
  say(html){ this.msgEl.innerHTML=html; }
  hit(m,x,y){
    for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
      if(!m[r][c]) continue;
      const gx=x+c, gy=y+r;
      if(gx<0||gx>=COLS||gy>=ROWS) return true;
      if(gy>=0&&this.grid[gy][gx]) return true;
    }
    return false;
  }
  spawn(){
    const t=this.forced.length?this.forced.shift():pieceAt(this.qi++), m=SHAPES[t].map(r=>r.slice());
    this.cur={t,m,x:Math.floor((COLS-m[0].length)/2),y:t==='I'?-1:0};
    this.drop=0; this.lockT=0; this.lockN=0;
    if(this.hit(m,this.cur.x,this.cur.y)){ this.cur=null; this.die(); }
  }
  grounded(){ const c=this.cur; return c&&this.hit(c.m,c.x,c.y+1); }
  resetLock(){ if(this.grounded()&&this.lockN<15){ this.lockT=0; this.lockN++; } }
  move(dx){ const c=this.cur; if(c&&!this.hit(c.m,c.x+dx,c.y)){ c.x+=dx; this.resetLock(); return true; } return false; }
  rotate(){
    const c=this.cur; if(!c||c.t==='O') return false;
    const m=rotCW(c.m);
    for(const [kx,ky] of [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[-1,-1],[1,-1]]){
      if(!this.hit(m,c.x+kx,c.y+ky)){ c.m=m; c.x+=kx; c.y+=ky; this.resetLock(); return true; }
    }
    return false;
  }
  soft(){ const c=this.cur; if(c&&!this.hit(c.m,c.x,c.y+1)){ c.y++; this.drop=0; } }
  hard(){ const c=this.cur; if(!c) return; while(!this.hit(c.m,c.x,c.y+1)) c.y++; this.lock(); }
  ghostY(){ const c=this.cur; let y=c.y; while(!this.hit(c.m,c.x,y+1)) y++; return y; }
  charge(n){ this.gauge=Math.min(this.ch.need,this.gauge+n); }
  lock(){
    const c=this.cur; if(!c) return;
    let over=false;
    c.m.forEach((r,ry)=>r.forEach((v,rx)=>{
      if(!v) return; const gy=c.y+ry;
      if(gy<0) over=true; else this.grid[gy][c.x+rx]=c.t;
    }));
    this.cur=null;
    if(over){ this.die(); return; }
    const full=[];
    for(let y=0;y<ROWS;y++) if(this.grid[y].every(v=>v)) full.push(y);
    const n=full.length;
    if(n){
      for(const y of full){ this.grid.splice(y,1); this.grid.unshift(Array(COLS).fill(null)); }
      this.lines+=n; this.combo++; this.flashT=180; this.charge(n);
      const tbl=this.ch.atk||[0,0,1,2,4];
      let atk=tbl[n];
      if(this.ch.id==='beat') atk+= this.combo>=2 ? Math.min(5,this.combo-1) : 0;
      else atk+= this.combo>2 ? Math.min(3,this.combo-2) : 0;
      if(this.grid.every(r=>r.every(v=>!v))) atk+=4;
      if(this.feverT>0) atk*=2;
      if(this.ch.id==='leaf' && n>=3){ const k=this.clearGarbage(2); if(k) this.pop(`🌿 회복 ${k}줄`); }
      if(this.ch.id==='prism' && n===4) this.charge(3);
      if(this.pending){
        const k=Math.min(this.pending,atk); this.pending-=k; atk-=k;
        if(this.ch.id==='aurora'&&k>0) this.bank=Math.min(6,this.bank+k);
      }
      if(atk>0&&this.bank){ atk+=this.bank; this.bank=0; }
      SFX.clear(n);
      if(atk>0){ SFX.attack(atk); this.mood('happy',1400); this.opp.receive(atk); this.pop(`공격 +${atk}`); }
      else if(n>=2) this.pop('상쇄!');
    }else{
      this.combo=0;
      if(this.pending){
        const k=Math.min(this.pending,8); this.pending-=k;
        this.addGarbage(k); if(this.dead) return;
      }
    }
    this.updateHud(); this.spawn();
  }
  receive(n,reflected){
    if(this.remote){ Net.send({t:'atk',n,ref:!!reflected}); return; }
    if(this.dead) return;
    if(this.shieldT>0){ SFX.block(); this.mood('happy',1200); this.pop('🛡️ 막음'); return; }
    if(this.ch.id==='chrono'&&!reflected&&Math.random()<0.3){ SFX.block(); this.mood('happy',1200); this.pop('⏳ 시간 회피'); return; }
    if(this.ch.id==='iron'){ n=Math.max(0,n-1); if(!n){ SFX.block(); this.mood('happy',1200); this.pop('🛡️ 막음'); return; } }
    if(this.ch.id==='echo'&&!reflected){
      if(this.reflectT>0){ this.opp.receive(n,true); this.mood('happy',1200); this.pop(`🪞 ${n}줄 반사`); return; }
      if(Math.random()<0.3){ this.opp.receive(1,true); this.mood('happy',1200); this.pop('🪞 1줄 반사'); n--; if(!n) return; }
    }
    this.pending+=n; this.charge(1); this.updateHud(); this.mood('shock',1500);
  }
  addGarbage(n){
    const hole=Math.floor(Math.random()*COLS);
    const removed=this.grid.splice(0,n);
    for(let i=0;i<n;i++) this.grid.push(Array.from({length:COLS},(_,x)=>x===hole?null:'G'));
    this.wrap.classList.remove('shake'); void this.wrap.offsetWidth; this.wrap.classList.add('shake');
    SFX.hit(n); this.mood('shock',1500);
    if(navigator.vibrate && !this.remote && !(mode==='cpu'&&this.id===1)) try{ navigator.vibrate(60); }catch(_){}
    if(removed.some(r=>r.some(v=>v))) this.die();
  }
  clearGarbage(k){
    let removed=0, y=ROWS-1;
    while(y>=0 && removed<k){
      if(this.grid[y].includes('G')){ this.grid.splice(y,1); this.grid.unshift(Array(COLS).fill(null)); removed++; }
      else y--;
    }
    return removed;
  }
  useSpecial(){
    if(state!=='playing'||this.dead||this.gauge<this.ch.need) return;
    this.gauge=0; const o=this.opp;
    // 내 쪽 효과
    switch(this.ch.id){
      case 'iron': this.shieldT=10000; break;
      case 'beat': this.feverT=8000; break;
      case 'chrono': this.pending=Math.max(0,this.pending-2); break;
      case 'leaf': this.clearGarbage(4); this.pending=0; break;
      case 'echo': this.reflectT=6000; break;
      case 'prism': this.forced.push('I','I','I'); break;
    }
    // 상대 쪽 효과 (온라인이면 상대 기기에서 적용)
    if(o.remote){ Net.send({t:'sp',id:this.ch.id}); oppFx(o,this.ch.id,true); }
    else oppFx(o,this.ch.id,false);
    SFX.special(); this.mood('happy',1500); this.pop(`${this.ch.emo} ${this.ch.spName}!`); this.flashT=200; this.updateHud();
  }
  die(){ if(this.dead) return; this.dead=true; if(mode==='online'&&!this.remote) Net.send({t:'dead'}); gameOver(this); }
  pop(text){
    const el=document.createElement('div'); el.className='pop disp'; el.textContent=text;
    this.wrap.appendChild(el); setTimeout(()=>el.remove(),1000);
  }
  updateHud(){
    this.linesEl.textContent=`${this.lines}줄`;
    this.gfill.style.height=Math.min(100,this.pending/ROWS*100)+'%';
    const pct=this.gauge/this.ch.need*100, full=this.gauge>=this.ch.need;
    this.gaugeFill.style.width=pct+'%'; this.gaugeEl.classList.toggle('full',full);
    this.spFill.style.width=pct+'%'; this.spBtn.classList.toggle('ready',full);
  }
  update(dt,interval){
    if(this.flashT>0) this.flashT-=dt;
    for(const k of ['shieldT','feverT','blindT','hasteT','reflectT','freezeT']) if(this[k]>0) this[k]=Math.max(0,this[k]-dt);
    this.status();
    this.updateHud();
    if(this.dead||!this.cur) return;
    let iv=interval*(this.ch.id==='chrono'?1.35:1);
    if(this.hasteT>0) iv/=3;
    this.drop+=dt;
    if(this.drop>=iv){ this.drop=0; if(!this.grounded()) this.cur.y++; }
    if(this.grounded()){ this.lockT+=dt; if(this.lockT>=500) this.lock(); }
    else this.lockT=0;
  }
  status(){
    const st=[];
    if(this.shieldT>0) st.push(`🛡️${Math.ceil(this.shieldT/1000)}`);
    if(this.feverT>0) st.push(`🎵×2 ${Math.ceil(this.feverT/1000)}`);
    if(this.blindT>0) st.push(`🙈${Math.ceil(this.blindT/1000)}`);
    if(this.hasteT>0) st.push(`⚡${Math.ceil(this.hasteT/1000)}`);
    if(this.reflectT>0) st.push(`🪞${Math.ceil(this.reflectT/1000)}`);
    if(this.freezeT>0) st.push(`❄️${Math.ceil(this.freezeT/1000)}`);
    if(this.forced.length) st.push(`💎I×${this.forced.length}`);
    if(this.bank>0) st.push(`❄️+${this.bank}`);
    const s=st.join(' ');
    if(s!==this.statusTxt){ this.statusTxt=s; this.statusEl.textContent=s; }
  }
  fit(){
    const desk=document.body.classList.contains('desk');
    const r=this.root.getBoundingClientRect();
    const W=r.width, H=r.height;
    const col=this.root.classList.contains('colbtn');
    const small=!desk&&document.body.classList.contains('vscpu')&&this.id===1;
    const tab=W>=700, pad=desk?16:12, gb=9; // 안쪽 여백, 방해 게이지 막대
    let availW, availH;
    if(col){
      // 양옆은 버튼 한 줄 폭만, 나머지는 전부 게임판
      const side=tab?Math.max(104,Math.min(150,Math.round(W*0.15))):Math.max(50,Math.min(66,Math.round(W*0.16)));
      this.root.style.setProperty('--side',side+'px');
      availW=W-pad-side*2-6-gb; availH=H-pad;
    }else{
      // 판이 세로 공간을 최대한 쓰도록 양옆 기둥 폭을 맞춤
      const cellH=Math.floor((H-pad)/ROWS);
      const ideal=(W-pad-6-gb-cellH*COLS)/2;
      const minSide=desk?100:small?(tab?120:66):(tab?120:70), maxSide=desk?100:(tab?180:130);
      const side=Math.max(minSide,Math.min(maxSide,ideal));
      this.root.style.setProperty('--side',side+'px');
      availW=W-pad-side*2-6-gb; availH=H-pad;
    }
    const s=Math.max(4,Math.floor(Math.min(availW/COLS,availH/ROWS)));
    this.cs=s;
    const dpr=window.devicePixelRatio||1;
    this.cv.style.width=s*COLS+'px'; this.cv.style.height=s*ROWS+'px';
    this.cv.width=s*COLS*dpr; this.cv.height=s*ROWS*dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.gbar.style.height=s*ROWS+'px';
    this.nv.style.width='48px'; this.nv.style.height='30px';
    this.nv.width=48*dpr; this.nv.height=30*dpr;
    this.nctx.setTransform(dpr,0,0,dpr,0,0);
    // 버튼 크기·간격: 정보칸 아래 남는 공간에 맞춤, 화면 끝에서 살짝 띄움
    this.root.style.setProperty('--lift','0px');
    if(col){
      const [ls,rs]=this.sides;
      const topH=side=>{ let h=0; for(const c of side.children){ if(c!==this.ctrlEl&&c!==this.rctrlEl&&getComputedStyle(c).display!=='none') h+=c.offsetHeight+6; } return h; };
      const free=H-pad-Math.max(topH(ls),topH(rs))-8;
      const maxB=tab?110:68, minB=38;
      const lift=Math.round(Math.min(H*0.07,Math.max(0,free-3*minB-16)*0.4));
      const gap=Math.round(Math.max(6,Math.min(tab?22:14,(free-lift)*0.06)));
      const bh=Math.floor(Math.max(minB,Math.min(maxB,(free-lift-2*gap)/3)));
      this.root.style.setProperty('--bh',bh+'px');
      this.root.style.setProperty('--bg',gap+'px');
      this.root.style.setProperty('--lift',lift+'px');
    }
  }
  draw(){
    const ctx=this.ctx, s=this.cs, W=COLS*s, H=ROWS*s;
    ctx.fillStyle=theme.well; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=theme.dot;
    const d=Math.max(1.5,s*0.08);
    for(let y=1;y<ROWS;y++) for(let x=1;x<COLS;x++) ctx.fillRect(x*s-d/2,y*s-d/2,d,d);
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      const v=this.grid[y][x]; if(v) drawCell(ctx,x,y,s,COLORS[v]);
    }
    const c=this.cur;
    if(c){
      if(this.blindT<=0&&this.opt.ghost){
        const gy=this.ghostY();
        c.m.forEach((r,ry)=>r.forEach((v,rx)=>{ if(v&&gy+ry>=0) drawCell(ctx,c.x+rx,gy+ry,s,COLORS[c.t],'ghost'); }));
      }
      c.m.forEach((r,ry)=>r.forEach((v,rx)=>{ if(v&&c.y+ry>=0) drawCell(ctx,c.x+rx,c.y+ry,s,COLORS[c.t]); }));
    }
    if(this.shieldT>0){ ctx.strokeStyle='rgba(160,200,255,.8)'; ctx.lineWidth=4; ctx.strokeRect(2,2,W-4,H-4); }
    if(this.feverT>0){ ctx.strokeStyle='rgba(190,110,255,.8)'; ctx.lineWidth=4; ctx.strokeRect(2,2,W-4,H-4); }
    if(this.reflectT>0){ ctx.strokeStyle='rgba(255,122,184,.85)'; ctx.lineWidth=4; ctx.strokeRect(2,2,W-4,H-4); }
    if(this.freezeT>0){ ctx.fillStyle='rgba(150,220,255,.22)'; ctx.fillRect(0,0,W,H); }
    if(this.flashT>0){ ctx.fillStyle=`rgba(255,255,255,${this.flashT/200*0.25})`; ctx.fillRect(0,0,W,H); }
    if(this.dead){ ctx.fillStyle='rgba(10,10,30,.55)'; ctx.fillRect(0,0,W,H); }
    const n=this.nctx; n.fillStyle=theme.well; n.fillRect(0,0,48,30);
    if(state==='playing'||state==='paused'||state==='over'){
      if(this.blindT>0){ n.fillStyle='#fff'; n.font='bold 16px sans-serif'; n.textAlign='center'; n.textBaseline='middle'; n.fillText('?',24,15); return; }
      const t=this.forced.length?this.forced[0]:pieceAt(this.qi), m=SHAPES[t];
      const cells=[]; m.forEach((r,y)=>r.forEach((v,x)=>v&&cells.push([x,y])));
      const xs=cells.map(p=>p[0]), ys=cells.map(p=>p[1]);
      const minX=Math.min(...xs), minY=Math.min(...ys);
      const cs=9, ox=(48-(Math.max(...xs)-minX+1)*cs)/2, oy=(30-(Math.max(...ys)-minY+1)*cs)/2;
      n.save(); n.translate(ox,oy);
      cells.forEach(([x,y])=>drawCell(n,x-minX,y-minY,cs,COLORS[t]));
      n.restore();
    }
  }
}

function oppFx(o,id,cosmetic){
  const label={blaze:'🔥 화염탄!',hawk:'🎯 눈가림!',chrono:'⏳ 시간 지배!',titan:'🪨 충격파!',aurora:'❄️ 빙결!'}[id];
  if(!label) return;
  o.pop(label);
  if(cosmetic) return;
  switch(id){
    case 'blaze': o.receive(4); break;
    case 'hawk': o.blindT=8000; o.receive(2); break;
    case 'chrono': o.receive(3); o.hasteT=8000; break;
    case 'titan': o.receive(3); if(o.cur&&!o.dead) o.hard(); break;
    case 'aurora': o.freezeT=4000; o.receive(1); break;
  }
}

/* ===== 컴퓨터 AI ===== */
function evalGrid(g,lines,pending){
  const h=Array(COLS).fill(0); let holes=0;
  for(let x=0;x<COLS;x++){
    let seen=false;
    for(let y=0;y<ROWS;y++){
      if(g[y][x]){ if(!seen){ h[x]=ROWS-y; seen=true; } }
      else if(seen) holes++;
    }
  }
  let agg=0,bump=0,maxH=0;
  for(let x=0;x<COLS;x++){ agg+=h[x]; maxH=Math.max(maxH,h[x]); if(x<COLS-1) bump+=Math.abs(h[x]-h[x+1]); }
  const lineW = 0.76 + (pending>0?0.3:0) + (maxH>12?0.4:0);
  return -0.51*agg + lineW*lines - 0.45*holes - 0.18*bump - (maxH>14?(maxH-14)*0.8:0);
}
function bestMove(p,err){
  const c=p.cur; if(!c) return null;
  let m=c.m; const opts=[];
  const rots=c.t==='O'?1:4;
  for(let r=0;r<rots;r++){
    for(let x=-2;x<COLS;x++){
      if(p.hit(m,x,c.y)) continue;
      let y=c.y; while(!p.hit(m,x,y+1)) y++;
      const g=p.grid.map(row=>row.slice()); let ok=true;
      m.forEach((row,ry)=>row.forEach((v,rx)=>{ if(v){ const gy=y+ry; if(gy<0) ok=false; else g[gy][x+rx]=1; } }));
      if(!ok) continue;
      let lines=0;
      for(let yy=ROWS-1;yy>=0;yy--){ if(g[yy].every(v=>v)){ g.splice(yy,1); g.unshift(Array(COLS).fill(null)); lines++; yy++; } }
      opts.push({r,x,score:evalGrid(g,lines,p.pending)});
    }
    m=rotCW(m);
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  if(Math.random()<err) return opts[Math.floor(Math.random()*Math.min(opts.length,8))];
  return opts[0];
}
class CPU{
  constructor(p,lvl){
    this.p=p; this.lvl=lvl;
    this.delay=Math.max(34,540-(lvl-1)*56);
    this.err=Math.max(0,(10-lvl)*0.045);
    this.hardDrop=lvl>=3;
    this.t=0; this.spT=0; this.plan=null; this.forPiece=null;
  }
  update(dt){
    const p=this.p; if(p.dead||!p.cur) return;
    if(p.freezeT>0) return;
    if(p.gauge>=p.ch.need){
      this.spT+=dt;
      const wait=600+(10-this.lvl)*500;
      const smart = p.ch.id==='leaf' ? (p.pending>0||p.grid.some(r=>r.includes('G'))) :
                    (p.ch.id==='iron'||p.ch.id==='echo') ? (p.opp.gauge>=p.opp.ch.need*0.7||p.pending>0||this.spT>8000) : true;
      if(this.spT>wait && smart){ this.spT=0; p.useSpecial(); }
    }
    if(p.cur!==this.forPiece){
      this.forPiece=p.cur;
      const mv=bestMove(p,this.err+(p.blindT>0?0.2:0));
      this.plan=mv?{rots:mv.r,x:mv.x}:null;
      this.t=-this.delay;
    }
    this.t+=dt; if(this.t<this.delay) return; this.t=0;
    const pl=this.plan;
    if(!pl){ p.soft(); return; }
    if(pl.rots>0){ if(!p.rotate()) pl.rots=0; else pl.rots--; return; }
    if(p.cur.x<pl.x){ if(!p.move(1)) pl.x=p.cur.x; return; }
    if(p.cur.x>pl.x){ if(!p.move(-1)) pl.x=p.cur.x; return; }
    if(this.hardDrop) p.hard(); else p.soft();
  }
}

/* ===== 온라인 (Supabase Realtime: 대기실 presence + 방 broadcast) ===== */
const Net={
  sb:null, me:Math.random().toString(36).slice(2,10),
  lobby:null, room:null, isHost:false, info:null, pw:'', peer:null, rooms:[],
  myReady:false, oppReady:false, myAgain:false, oppAgain:false, acc:0, joinCb:null,
  get active(){ return !!(this.lobby||this.room); },
  configured(){ return !!(ONLINE.url&&ONLINE.key); },
  async load(){
    if(this.sb) return true;
    if(!this.configured()) return false;
    if(!window.supabase){
      await new Promise((res,rej)=>{ const sc=document.createElement('script');
        sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
        sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
    }
    this.sb=window.supabase.createClient(ONLINE.url,ONLINE.key,{auth:{persistSession:false},realtime:{params:{eventsPerSecond:40}}});
    return true;
  },
  openLobby(){
    if(this.lobby) return;
    const ch=this.sb.channel('bd-lobby',{config:{presence:{key:this.me}}});
    ch.on('presence',{event:'sync'},()=>{
      const st=ch.presenceState();
      this.rooms=Object.values(st).flat().map(x=>x.room).filter(Boolean);
      if(state==='lobby') renderLobbyList();
    });
    this.lobbyStat='connecting'; this.lobbyErr='';
    ch.subscribe((s,err)=>{
      this.lobbyStat=s; this.lobbyErr=err?String(err.message||err):'';
      if(s==='SUBSCRIBED'&&this.isHost&&this.info) ch.track({room:this.info});
      updateLbStat();
      if(s!=='SUBSCRIBED'&&this.isHost&&state==='select'&&!this.peer)
        P1.say(waitHtml(`⚠️ 서버 연결 문제 (${esc(s)})<br>${esc(this.lobbyErr).slice(0,80)}`));
    });
    this.lobby=ch;
  },
  closeLobby(){ const l=this.lobby; this.lobby=null; if(l) try{ this.sb.removeChannel(l); }catch(_){} },
  advertise(){ if(this.lobby&&this.info) try{ this.lobby.track({room:{...this.info}}); }catch(_){} },
  openRoom(id,onReady){
    const ch=this.sb.channel('bd-room-'+id,{config:{broadcast:{self:false},presence:{key:this.me}}});
    ch.on('broadcast',{event:'m'},({payload})=>this.onMsg(payload));
    ch.on('presence',{event:'leave'},({key})=>{ if(key&&key===this.peer) this.peerLeft(); });
    ch.subscribe((s,err)=>{
      if(s==='SUBSCRIBED'){ try{ ch.track({at:Date.now()}); }catch(_){} onReady&&onReady(); }
      else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){ this.roomErr=s+(err?': '+(err.message||err):''); if(this.joinCb) this.joinCb({ok:false,why:'net',err:this.roomErr}); }
    });
    this.room=ch;
  },
  closeRoom(){ const r=this.room; this.room=null; if(r) try{ this.sb.removeChannel(r); }catch(_){} },
  send(m){ if(!this.room) return; m.from=this.me; try{ this.room.send({type:'broadcast',event:'m',payload:m}); }catch(_){} },
  create(name,pw){
    this.isHost=true; this.pw=pw; this.peer=null; this.resetFlags();
    this.info={id:Math.random().toString(36).slice(2,8), name, lock:!!pw, full:false};
    this.openRoom(this.info.id); this.openLobby(); this.advertise();
  },
  join(info,pw){
    this.isHost=false; this.info=info; this.peer=null; this.resetFlags();
    return new Promise(res=>{
      const t=setTimeout(()=>{ this.joinCb=null; this.closeRoom(); res({ok:false,why:'timeout'}); },8000);
      this.joinCb=r=>{ clearTimeout(t); this.joinCb=null; if(!r.ok) this.closeRoom(); res(r); };
      this.openRoom(info.id,()=>this.send({t:'join',pw}));
    });
  },
  leaveAll(){
    if(this.room) this.send({t:'bye'});
    const r=this.room, l=this.lobby;
    this.room=null; this.lobby=null; this.isHost=false; this.info=null; this.peer=null; this.resetFlags();
    setTimeout(()=>{ try{ r&&this.sb.removeChannel(r); }catch(_){} try{ l&&this.sb.removeChannel(l); }catch(_){} },250);
  },
  resetFlags(){ this.myReady=this.oppReady=this.myAgain=this.oppAgain=false; },
  onMsg(m){
    if(!m||m.from===this.me) return;
    if(m.to&&m.to!==this.me) return;
    if(m.t==='join'){
      if(!this.isHost) return;
      if(this.peer&&this.peer!==m.from){ this.send({t:'joinres',to:m.from,ok:false,why:'full'}); return; }
      if((this.pw||'')!==(m.pw||'')){ this.send({t:'joinres',to:m.from,ok:false,why:'pw'}); return; }
      this.peer=m.from; this.info.full=true; this.advertise();
      this.send({t:'joinres',to:m.from,ok:true});
      onPeerJoined(); return;
    }
    if(m.t==='joinres'){ if(this.joinCb){ if(m.ok) this.peer=m.from; this.joinCb(m); } return; }
    if(m.from!==this.peer) return;
    onNetMsg(m);
  },
  peerLeft(){
    if(!this.peer) return;
    this.peer=null; this.oppReady=false; this.oppAgain=false;
    if(this.isHost&&this.info){ this.info.full=false; this.advertise(); }
    onPeerLeft();
  },
  tick(dt){ this.acc+=dt; if(this.acc>=100){ this.acc=0; this.send({t:'st',s:P2.snap()}); } },
  sendPick(){ this.send({t:'pick',cid:P2.ch.id,name:P2.dispName()}); },
  startNow(){
    const seed=(Math.random()*2147483647)|0;
    this.send({t:'start',seed}); closePickers(); hideCard(); startGame(seed);
  },
  maybeStart(){ if(this.isHost&&this.peer&&this.myReady&&this.oppReady&&state==='select') this.startNow(); },
  maybeAgain(){ if(this.isHost&&this.peer&&this.myAgain&&this.oppAgain&&state==='over') this.startNow(); },
};
function waitHtml(t){ return `<div class="big">⏳</div><div class="sm">${t}</div>`; }
function onPeerJoined(){
  SFX.go();
  P1.say(waitHtml('상대가 들어왔어요!<br>캐릭터를 고르는 중…'));
  if(Net.myReady) Net.sendPick();
}
function onNetMsg(m){
  switch(m.t){
    case 'pick':
      Net.oppReady=true; P1.remoteName=String(m.name||'').slice(0,12); P1.setChar(CMAP[m.cid]||CHARS[0]);
      if(state==='select') P1.say(`${avatar(P1.ch,72,'happy')}<div class="sm">${esc(P1.dispName())} 준비 완료</div>`);
      Net.maybeStart(); break;
    case 'unpick':
      Net.oppReady=false; if(state==='select') P1.say(waitHtml('상대가 캐릭터를 다시 고르는 중…')); break;
    case 'start':
      closePickers(); hideCard(); startGame(m.seed); break;
    case 'st': P1.applySnap(m.s); break;
    case 'atk':
      if(state==='playing'){ P1.pop(`공격 +${m.n}`); P1.mood('happy',1200); P2.receive(m.n|0,!!m.ref); } break;
    case 'sp':
      if(state==='playing'&&CMAP[m.id]){ const c=CMAP[m.id]; P1.pop(`${c.emo} ${c.spName}!`); P1.mood('happy',1500); SFX.special(); oppFx(P2,m.id,false); } break;
    case 'dead':
      if(state==='playing'&&!P1.dead){ P1.dead=true; gameOver(P1); } break;
    case 'again': Net.oppAgain=true; Net.maybeAgain(); break;
    case 'bye': Net.peerLeft(); break;
  }
}
function onPeerLeft(){
  if(mode!=='online') return;
  if(state==='playing'||state==='count'){
    if(state==='count'){ state='playing'; }
    P1.dead=true; gameOver(P1);
    setTimeout(()=>P1.say(waitHtml('상대가 방을 나갔어요')),1500);
    return;
  }
  if(Net.isHost){
    hideCard(); openPickers();
    P1.say(waitHtml(`상대가 나갔어요.<br>「${esc(Net.info?Net.info.name:'')}」 방에서 새 상대를 기다리는 중…`));
  }else{
    Net.closeRoom();
    showCard(`<h1 class="disp">상대가 나갔어요</h1><p>방이 닫혔어요.</p>
      <div class="btns"><button class="btn" data-go="lobby">대기실로</button><button class="btn ghost" data-go="menu">처음으로</button></div>`, actions.lobby);
  }
}

  renderLobbyList(); updateLbStat();
  $('#mkRoom').addEventListener('click',()=>{
    const name=$('#rmName').value.trim(), pw=$('#rmPw').value.trim();
    if(!name){ $('#lbMsg').textContent='방 이름을 입력해 주세요.'; $('#rmName').focus(); return; }
    FS.enter(); Net.create(name,pw); hideCard(); openPickers();
    P1.say(waitHtml(`「${esc(name)}」 방을 만들었어요${pw?' 🔒':''}<br>상대를 기다리는 중…`));
  });
}
function updateLbStat(){
  const el=$('#lbStat'); if(!el) return;
  const st=Net.lobbyStat;
  if(st==='SUBSCRIBED'){ el.className='lb-stat ok'; el.textContent='● 서버 연결됨 · 방 목록 실시간 갱신 중'; }
  else if(st==='connecting'){ el.className='lb-stat'; el.textContent='● 서버에 연결하는 중…'; }
  else{ el.className='lb-stat bad'; el.textContent=`● 연결 실패 (${st}) ${Net.lobbyErr||''}`.slice(0,120); }
}
function renderLobbyList(){
  const el=$('#lbList'); if(!el) return;
  const rooms=Net.rooms.slice().sort((a,b)=>(a.full-b.full)||String(a.name).localeCompare(String(b.name)));
  if(!rooms.length){ el.innerHTML='<div class="lb-empty">아직 열린 방이 없어요.<br>새 방을 만들어 보세요!</div>'; return; }
  el.innerHTML=rooms.map(r=>`<button class="lb-room${r.full?' full':''}" data-room="${esc(r.id)}">
    <span>${r.lock?'🔒 ':''}${esc(r.name)}</span><small>${r.full?'게임 중':'대기 중 · 1/2'}</small></button>`).join('');
  el.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{
    const r=Net.rooms.find(x=>x.id===b.dataset.room); if(!r) return;
    if(r.full){ $('#lbMsg').textContent='이미 게임 중인 방이에요.'; return; }
    if(!r.lock){ doJoin(r,''); return; }
    const box=$('#lbJoin'); box.classList.remove('hidden');
    box.innerHTML=`<div class="lb-jt">🔒 「${esc(r.name)}」 비밀번호</div>
      <input id="jPw" type="text" maxlength="12" autocomplete="off" placeholder="비밀번호">
      <div class="btns"><button class="btn" id="jGo">입장</button><button class="btn ghost" id="jNo">취소</button></div>`;
    $('#jPw').focus();
    const go=()=>doJoin(r,$('#jPw').value.trim());
    $('#jGo').addEventListener('click',go);
    $('#jPw').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    $('#jNo').addEventListener('click',()=>{ box.classList.add('hidden'); box.innerHTML=''; });
  }));
}
async function doJoin(r,pw){
  const msg=$('#lbMsg'); if(msg) msg.textContent='입장하는 중…';
  FS.enter();
  const res=await Net.join(r,pw);
  if(state!=='lobby') return;
  if(res.ok){
    Net.closeLobby(); hideCard(); openPickers();
    P1.say(waitHtml(`「${esc(r.name)}」 방에 들어왔어요<br>상대가 캐릭터를 고르는 중…`));
  }else if($('#lbMsg')){
    $('#lbMsg').textContent = res.why==='pw' ? '비밀번호가 틀렸어요.' : res.why==='full' ? '이미 다른 사람이 들어간 방이에요.' : res.why==='net' ? `서버 연결 오류: ${res.err||''}` : '방에 연결할 수 없어요. 방이 닫혔을 수 있어요.';
  }
}
function onlineExitCard(){
  showCard(`<h1 class="disp">방 나가기</h1>
    <p>온라인 대결은 멈출 수 없어요.<br>지금 나가면 이번 판은 패배로 처리돼요.</p>
    <div class="btns"><button class="btn" data-go="hide">계속하기</button><button class="btn ghost" data-go="menu">나가기</button></div>`, actions.hide);
}

/* ===== 게임 흐름 ===== */
const P1=new Player(1,$('#p1')), P2=new Player(2,$('#p2'));
P1.opp=P2; P2.opp=P1;
const players=[P1,P2];
let conqOn=false, conq=null, conqTarget=null;
function loadConq(){ try{ const v=JSON.parse(localStorage.getItem('bd_conq')||'null'); return (v&&CMAP[v.char])?v:null; }catch(_){ return null; } }
function saveConq(){ try{ localStorage.setItem('bd_conq',JSON.stringify(conq)); }catch(_){} }
function clearConq(){ try{ localStorage.removeItem('bd_conq'); }catch(_){} }
let state='menu', mode='pvp', cpuLvl=5, cpu=null, elapsed=0, wins={1:0,2:0}, primaryAction=null;
const picks={1:null,2:null}, readyFlags={1:false,2:false};

const overlay=$('#overlay'), card=$('#card');
function showCard(html,primary){
  card.innerHTML=html; overlay.classList.remove('hidden'); primaryAction=primary||null;
  card.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.go]()));
}
function hideCard(){ overlay.classList.add('hidden'); primaryAction=null; }

const LVDESC=['','입문','쉬움','쉬움','보통','보통','보통','어려움','어려움','고수','최강'];
const LVCOL=['','#3ddc97','#3ddc97','#3ddc97','#4d9de0','#4d9de0','#4d9de0','#ff9f1c','#ff9f1c','#ff5a3c','#b05cff'];

const actions={
  menu(){ menu(); },
  pvp(){ FS.enter(); mode='pvp'; wins={1:0,2:0}; updateScore(); hideCard(); openPickers(); },
  cpu(){ FS.enter(); cpuSetup(); },
  cpuNext(){ FS.enter(); mode='cpu'; wins={1:0,2:0}; updateScore(); hideCard(); openPickers(); },
  resume(){ FS.enter(); hideCard(); state='playing'; Music.start(); Wake.on(); },
  restart(){ FS.enter(); hideCard(); startGame(); },
  repick(){ hideCard(); openPickers(); },
  online(){ FS.enter(); goOnline(); },
  lobby(){ lobby(); },
  hide(){ hideCard(); },
  onAgain(){
    FS.enter();
    if(!Net.peer){ showCard(`<h1 class="disp">상대가 나갔어요</h1><div class="btns"><button class="btn" data-go="${Net.isHost?'repickOnline':'lobby'}">${Net.isHost?'새 상대 기다리기':'대기실로'}</button><button class="btn ghost" data-go="menu">처음으로</button></div>`); return; }
    Net.myAgain=true; Net.send({t:'again'});
    showCard(`<h1 class="disp">한 판 더</h1><p>상대도 '한 판 더'를 누르면 바로 시작해요.</p>
      <div class="btns"><button class="btn ghost" data-go="menu">나가기</button></div>`);
    Net.maybeAgain();
  },
  repickOnline(){ hideCard(); openPickers(); P1.say(waitHtml('새 상대를 기다리는 중…')); },
  conq(){ FS.enter(); conqStart(); },
  conqNew(){ clearConq(); conq=null; cpuSetup(true); },
  conqGo(){ FS.enter(); mode='cpu'; conqOn=true; wins={1:0,2:0}; updateScore(); hideCard(); openPickers(); },
  conqCont(){ FS.enter(); mode='cpu'; conqOn=true; conq=loadConq(); wins={1:0,2:0}; updateScore();
    P2.setChar(CMAP[conq.char]); hideCard(); conqMap(); },
  conqMap(){ hideCard(); conqMap(); },
  conqRetry(){ FS.enter(); hideCard(); startGame(); },
};

/* ===== 정복 모드 ===== */
function conqLevel(){ return Math.min(10, conq.base + conq.done.length); }
function conqStart(){
  const saved=loadConq();
  if(saved && saved.done.length < CHARS.length-1){
    const me=CMAP[saved.char];
    showCard(`<h1 class="disp">🏆 정복 모드</h1>
      <div class="cq-me">${avatar(me,40,'happy')}<span><b style="color:var(--ink)">${esc(P2.nameFor(me.id))}</b> 진행 중 · ${saved.done.length}/${CHARS.length-1} 정복</span></div>
      <div class="btns"><button class="btn" data-go="conqCont">이어하기</button><button class="btn ghost" data-go="conqNew">새로 시작</button><button class="btn ghost" data-go="menu">뒤로</button></div>`, actions.conqCont);
  }else cpuSetup(true);
}
function conqMap(){
  state='map'; setLabels();
  players.forEach(p=>{ p.reset(); p.say(''); });
  const me=CMAP[conq.char], foes=CHARS.filter(c=>c.id!==conq.char), n=conq.done.length, lv=conqLevel();
  P2.say(`${avatar(me,72,'happy')}<div class="sm">${esc(P2.nameFor(me.id))}</div>`);
  P1.say(`<div class="big">?</div><div class="sm">다음 상대를 골라요</div>`);
  showCard(`<h1 class="disp">정복할 상대</h1>
    <div class="cq-prog"><span>${n}/${foes.length}</span><div class="bar"><i style="width:${n/foes.length*100}%"></i></div><span>다음 Lv.${lv}</span></div>
    <div class="cq-grid">${foes.map(c=>{ const d=conq.done.includes(c.id);
      return `<button class="cq${d?' done':''}" data-cq="${c.id}" style="--c:${c.c}" ${d?'disabled':''}>${avatar(c,40,d?'shock':'normal')}
        <span>${esc(c.name)}</span><small>${c.flag} ${c.type}</small></button>`; }).join('')}</div>
    <p style="margin:0 0 10px">한 명을 정복할 때마다 컴퓨터 레벨이 1씩 올라가요.</p>
    <div class="btns"><button class="btn ghost" data-go="menu">처음으로</button></div>`);
  card.querySelectorAll('[data-cq]').forEach(b=>b.addEventListener('click',()=>{
    FS.enter();
    conqTarget=b.dataset.cq; cpuLvl=conqLevel();
    P1.setChar(CMAP[conqTarget]); setLabels(); hideCard(); startGame();
  }));
}

function setLabels(){
  document.body.classList.toggle('vscpu',mode==='cpu'||mode==='online');
  document.body.classList.toggle('online',mode==='online');
  players.forEach(p=>p.applyOpt());
  requestAnimationFrame(fitAll);
  P1.nameEl.textContent = mode==='cpu' ? `CPU Lv.${cpuLvl}` : mode==='online' ? '상대' : 'P1';
  P2.nameEl.textContent = mode==='cpu' ? 'YOU' : mode==='online' ? '나' : 'P2';
  requestAnimationFrame(fitAll);
}

function menu(){
  if(Net.active) Net.leaveAll();
  P1.remote=false; P1.remoteName=null;
  state='menu'; conqOn=false; Music.stop(); Wake.off(); cpu=null; closePickers(); players.forEach(p=>{p.reset(); p.say('');});
  document.body.classList.remove('vscpu','online'); players.forEach(p=>p.applyOpt()); requestAnimationFrame(fitAll);
  showCard(`<div class="mirror">대결 블록 · 모드를 골라 주세요</div>
    <h1 class="disp"><span class="a">대결</span> <span class="b">블록</span></h1>
    <p>2줄 이상 한 번에 지우면 상대에게 방해 줄이 올라가요.<br>캐릭터마다 공격·방어·필살기가 달라요.</p>
    <div class="modes">
      <button class="mode" data-go="pvp"><b>👥 둘이서 대결</b><span>폰을 눕히고 위·아래 끝에 마주 앉아요</span></button>
      <button class="mode" data-go="online"><b>🌐 온라인 대결</b><span>방을 만들거나 들어가서 각자 기기로 대결해요</span></button>
      <button class="mode" data-go="cpu"><b>🤖 컴퓨터와 대결</b><span>난이도 1~10 중에서 골라요</span></button>
      <button class="mode" data-go="conq"><b>🏆 정복 모드</b><span>컴퓨터 캐릭터 9명을 하나씩 이겨서 모두 정복해요</span></button>
    </div>
    <div class="credit">Made by mujjinhwan with yang</div>${FS.can()?'':`<p style="margin:12px 0 0;font-size:12px">이 기기는 브라우저 전체화면을 지원하지 않아요.<br>공유 → <b>홈 화면에 추가</b>로 열면 전체화면으로 플레이돼요.</p>`}`);
}
function cpuSetup(forConq){
  const grid=Array.from({length:10},(_,i)=>`<button class="lvb${i+1===cpuLvl?' sel':''}" data-lv="${i+1}" style="--c:${LVCOL[i+1]}">${i+1}</button>`).join('');
  const next=forConq?'conqGo':'cpuNext';
  showCard(`<h1 class="disp">${forConq?'🏆 시작 난이도':'컴퓨터 난이도'}</h1>
    <p>${forConq?'첫 상대의 레벨이에요. 한 명 정복할 때마다 1씩 올라가요.':'숫자가 클수록 빠르고 실수가 적어요.'}</p>
    <div class="lvgrid">${grid}</div><div class="lvdesc" id="lvdesc">레벨 ${cpuLvl} · ${LVDESC[cpuLvl]}</div>
    <div class="btns"><button class="btn ghost" data-go="menu">뒤로</button><button class="btn" data-go="${next}">캐릭터 고르기</button></div>`, actions[next]);
  card.querySelectorAll('.lvb').forEach(b=>b.addEventListener('click',()=>{
    cpuLvl=+b.dataset.lv;
    card.querySelectorAll('.lvb').forEach(x=>x.classList.toggle('sel',x===b));
    $('#lvdesc').textContent=`레벨 ${cpuLvl} · ${LVDESC[cpuLvl]}`;
  }));
}

/* 캐릭터 선택 */
function openPickers(){
  state='select'; Music.stop(); setLabels();
  readyFlags[1]=readyFlags[2]=false;
  players.forEach(p=>{ p.reset(); });
  if(mode==='online'){
    readyFlags[1]=true; Net.myReady=false; P1.picker.classList.add('hidden');
    renderPicker(P2);
  }else if(mode==='cpu'&&conqOn){
    readyFlags[1]=true; P1.picker.classList.add('hidden');
    P1.say(`<div class="big">🏆</div><div class="sm">내 캐릭터를 고르면<br>정복할 상대 목록이 나와요</div>`);
    renderPicker(P2);
  }else if(mode==='cpu'){
    const ch=CHARS[Math.floor(Math.random()*CHARS.length)];
    picks[1]=ch.id; P1.setChar(ch); readyFlags[1]=true;
    P1.picker.classList.add('hidden');
    P1.say(`${avatar(ch,72)}<div class="sm">CPU Lv.${cpuLvl} · ${ch.flag} ${esc(ch.name)}</div>`);
    renderPicker(P2);
  }else{
    renderPicker(P1); renderPicker(P2);
  }
}
function closePickers(){ players.forEach(p=>p.picker.classList.add('hidden')); }
function renderPicker(p){
  const sel=CMAP[picks[p.id]]||CHARS[p.id===1?0:1];
  picks[p.id]=sel.id;
  const who = (mode==='cpu'||mode==='online') ? '내' : `P${p.id}`;
  p.picker.innerHTML=`
    <div class="pk-head disp">${who} 캐릭터 선택</div>
    <div class="pk-grid">${CHARS.map(c=>`<button class="ch${c.id===sel.id?' sel':''}" data-id="${c.id}" style="--c:${c.c}">
      ${avatar(c,44)}<span class="fl">${c.flag}</span><span class="nm">${esc(p.nameFor(c.id))}</span><small>${c.type}</small></button>`).join('')}</div>
    <div class="pk-info"><div class="pk-who">${avatar(sel,52,'happy')}<div><b class="pk-nm">${esc(p.nameFor(sel.id))}</b> · ${sel.type}<br>
      <span class="sub">${sel.flag} ${sel.nat} · ${sel.g==='m'?'남':'여'}</span></div></div>
      <label class="pk-name">이름 바꾸기<input type="text" maxlength="8" autocomplete="off" placeholder="${esc(sel.name)}" value="${esc(p.names[sel.id]||'')}"></label>
      <span class="k">특성</span> ${sel.passive}<br>
      <span class="k">필살기 · ${sel.spName}</span> (${sel.need}줄 충전) ${sel.special}</div>
    <div class="pk-opts one">
      <div class="opt">착지 미리보기
        <div class="seg"><button data-opt="ghost" data-v="1" class="${p.opt.ghost?'on':''}">보이기</button><button data-opt="ghost" data-v="0" class="${p.opt.ghost?'':'on'}">숨기기</button></div>
        <small>${p.opt.ghost?'블록이 떨어질 자리 표시':'표시 안 함 (고수용)'}</small></div>
    </div>
    <button class="pk-go">이 캐릭터로 준비</button>`;
  const inp=p.picker.querySelector('.pk-name input');
  inp.addEventListener('input',()=>{
    p.names[sel.id]=inp.value; p.saveNames();
    const nm=p.nameFor(sel.id);
    p.picker.querySelector('.pk-nm').textContent=nm;
    p.picker.querySelector(`.ch[data-id="${sel.id}"] .nm`).textContent=nm;
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); });
  p.picker.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{
    p.opt[b.dataset.opt]=b.dataset.v==='1'; p.saveOpt(); p.applyOpt(); renderPicker(p); p.fit();
  }));
  p.picker.classList.remove('hidden');
  p.picker.querySelectorAll('.ch').forEach(b=>b.addEventListener('click',()=>{ picks[p.id]=b.dataset.id; renderPicker(p); }));
  p.picker.querySelector('.pk-go').addEventListener('click',()=>{
    FS.enter();
    readyFlags[p.id]=true; p.setChar(CMAP[picks[p.id]]);
    if(readyFlags[1]&&readyFlags[2]&&mode!=='online'){
      closePickers();
      if(conqOn){ conq={char:p.ch.id, base:cpuLvl, done:[]}; saveConq(); conqMap(); }
      else startGame();
    }
    else{
      // 먼저 준비한 사람도 상대가 고르기 전까지는 캐릭터·이름을 다시 바꿀 수 있음
      p.picker.innerHTML=`<div class="pk-head disp">${esc(p.dispName())} 준비 완료</div>
        <div style="display:flex;justify-content:center">${avatar(sel,72,'happy')}</div>
        <div class="pk-wait">${mode==='online'?'상대가 준비하면 바로 시작해요.':'상대가 캐릭터를 고르는 중이에요…'}<br>그 전까지는 다시 바꿀 수 있어요.</div>
        <button class="pk-go pk-back">↩ 캐릭터·이름 다시 고르기</button>`;
      p.picker.querySelector('.pk-back').addEventListener('click',()=>{
        if(state!=='select') return; readyFlags[p.id]=false;
        if(mode==='online'){ Net.myReady=false; Net.send({t:'unpick'}); }
        renderPicker(p);
      });
      if(mode==='online'){ Net.myReady=true; Net.sendPick(); Net.maybeStart(); }
    }
  });
}

function startGame(seed){
  seq=[]; seedRng(seed); players.forEach(p=>p.reset()); elapsed=0; setLv(1);
  if(mode==='online'){ Net.myAgain=Net.oppAgain=false; Net.acc=0; }
  cpu = mode==='cpu' ? new CPU(P1,cpuLvl) : null;
  state='count'; let n=3;
  const tick=()=>{
    if(state!=='count') return;
    if(n===0){ players.forEach(p=>{p.say('');p.spawn();}); state='playing'; SFX.go(); Music.reset(); Music.start(); Wake.on(); return; }
    SFX.count();
    players.forEach(p=>p.say(`<div class="big pulse">${n}</div><div class="sm">${p.ch.flag} ${esc(p.dispName())}</div>`)); n--; setTimeout(tick,700);
  };
  tick();
}
function gameOver(loser){
  if(state!=='playing') return;
  state='over'; releaseAll();
  const winner=loser.opp; wins[winner.id]++; updateScore();
  const solo = mode==='cpu'||mode==='online';
  Music.stop(); Wake.off(); if(solo&&winner.id===1) SFX.lose(); else SFX.win();
  const youWin = solo ? winner.id===2 : null;
  winner.say(`<div class="big">승리!</div><div class="sm">${winner.lines}줄 · 전적 ${wins[winner.id]} : ${wins[loser.id]}</div>`);
  loser.say(`<div class="big">패배</div><div class="sm">${loser.lines}줄 · 전적 ${wins[loser.id]} : ${wins[winner.id]}</div>`);
  loser.root.classList.add('loser');
  winner.mood('happy'); loser.mood('shock');
  const title = mode==='online' ? (youWin?'<span class="b">승리!</span>':`<span class="a">${esc(P1.dispName())} 승리</span>`)
              : mode==='cpu' ? (youWin?'<span class="b">승리!</span>':'<span class="a">CPU 승리</span>')
                             : `<span class="${winner.id===1?'a':'b'}">${esc(winner.dispName())} 승리</span>`;
  const score = mode==='online' ? `나 ${wins[2]} : ${wins[1]} ${esc(P1.dispName())}` : mode==='cpu' ? `나 ${wins[2]} : ${wins[1]} CPU Lv.${cpuLvl}` : `${esc(P1.dispName())} ${wins[1]} : ${wins[2]} ${esc(P2.dispName())}`;
  if(mode==='online'){
    setTimeout(()=>{ if(state!=='over') return; showCard(`<h1 class="disp">${title}</h1><p>${score}</p>
      <div class="btns"><button class="btn" data-go="onAgain">한 판 더</button><button class="btn ghost" data-go="menu">나가기</button></div>`, actions.onAgain); }, 1400);
    return;
  }
  if(conqOn){
    const foe=CMAP[conqTarget], total=CHARS.length-1;
    if(youWin && !conq.done.includes(foe.id)){ conq.done.push(foe.id); saveConq(); }
    const all=conq.done.length>=total;
    if(all) clearConq();
    setTimeout(()=>{ if(state!=='over') return;
      if(all) showCard(`<h1 class="disp"><span class="b">🏆 전체 정복!</span></h1>
        <div class="cq-me">${avatar(CMAP[conq.char],56,'happy')}</div>
        <p>${esc(P2.nameFor(conq.char))}(이)가 ${total}명을 모두 정복했어요!</p>
        <div class="btns"><button class="btn" data-go="conq">다시 도전</button><button class="btn ghost" data-go="menu">처음으로</button></div>`, actions.menu);
      else if(youWin) showCard(`<h1 class="disp"><span class="b">${esc(foe.name)} 정복!</span></h1>
        <div class="cq-me">${avatar(foe,48,'shock')}<span>${conq.done.length}/${total} 정복 · 다음 상대는 Lv.${conqLevel()}</span></div>
        <div class="btns"><button class="btn" data-go="conqMap">다음 상대 고르기</button><button class="btn ghost" data-go="menu">처음으로</button></div>`, actions.conqMap);
      else showCard(`<h1 class="disp"><span class="a">${esc(foe.name)}에게 패배</span></h1>
        <div class="cq-me">${avatar(foe,48,'happy')}<span>${conq.done.length}/${total} 정복 · 진행 상황은 저장돼요</span></div>
        <div class="btns"><button class="btn" data-go="conqRetry">다시 도전</button><button class="btn ghost" data-go="conqMap">다른 상대</button><button class="btn ghost" data-go="menu">처음으로</button></div>`, actions.conqRetry);
    }, 1400);
    return;
  }
  setTimeout(()=>{ if(state!=='over') return; showCard(`<div class="mirror">${esc(winner.dispName())} 승리 · 한 판 더?</div>
    <h1 class="disp">${title}</h1><p>${score}</p>
    <div class="btns"><button class="btn" data-go="restart">한 판 더</button><button class="btn ghost" data-go="repick">캐릭터 변경</button><button class="btn ghost" data-go="menu">처음으로</button></div>`, actions.restart); }, 1400);
}
function pause(){
  if(state!=='playing') return;
  if(mode==='online'){ onlineExitCard(); return; }
  state='paused'; releaseAll(); Music.stop(); Wake.off();
  showCard(`<div class="mirror">일시정지</div><h1 class="disp">일시정지</h1>
    <div class="btns"><button class="btn" data-go="resume">계속하기</button><button class="btn ghost" data-go="restart">새 판</button><button class="btn ghost" data-go="menu">처음으로</button></div>`, actions.resume);
}
function updateScore(){ P1.winsEl.textContent=wins[1]; P2.winsEl.textContent=wins[2]; }
function setLv(l){ $('#lv').textContent='LV '+l; $('#lvTop').textContent='LV '+l; }

$('#pauseBtn').addEventListener('click',pause);
$('#homeBtn').addEventListener('click',askHome);
const fsBtn=$('#fsBtn');
if(!FS.can()) fsBtn.style.display='none';
fsBtn.addEventListener('click',()=>FS.toggle());
function onFs(){ fsBtn.textContent=FS.is()?'🗗':'⛶'; if(!FS.is()) pause(); setTimeout(fitAll,120); }
document.addEventListener('fullscreenchange',onFs);
document.addEventListener('webkitfullscreenchange',onFs);
function askHome(){
  if(state==='menu') return;
  if(mode==='online'&&state==='playing'){ onlineExitCard(); return; }
  if(state!=='playing'&&state!=='paused'){ hideCard(); menu(); return; } // 선택·지도·카운트다운·결과 화면은 바로 이동
  if(state==='playing'){ state='paused'; releaseAll(); Music.stop(); Wake.off(); }
  showCard(`<div class="mirror">처음 화면으로 갈까요?</div><h1 class="disp">처음으로</h1>
    <p>진행 중인 판은 사라지고 모드 선택 화면으로 돌아가요.</p>
    <div class="btns"><button class="btn" data-go="menu">처음으로</button><button class="btn ghost" data-go="resume">계속하기</button></div>`, actions.resume);
}
const bgmBtn=$('#bgmBtn'), sfxBtn=$('#sfxBtn');
function syncSnd(){ bgmBtn.classList.toggle('off',!Snd.bgmOn); sfxBtn.classList.toggle('off',!Snd.sfxOn); sfxBtn.textContent=Snd.sfxOn?'🔊':'🔇'; }
bgmBtn.addEventListener('click',()=>{ Snd.toggleBgm(); syncSnd(); });
sfxBtn.addEventListener('click',()=>{ Snd.toggleSfx(); syncSnd(); });
syncSnd();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
const landMQ=matchMedia('(pointer:coarse) and (orientation:landscape)');
landMQ.addEventListener('change',()=>{ if(landMQ.matches) pause(); });

/* ===== 입력 ===== */
function act(p,a){
  if(state!=='playing'||p.dead) return;
  if((mode==='cpu'||mode==='online')&&p===P1) return;
  if(p.freezeT>0&&a!=='S') return;
  if(a==='L') p.move(-1); else if(a==='R') p.move(1);
  else if(a==='U'){ if(p.rotate()) SFX.rotate(); }
  else if(a==='D') p.soft(); else if(a==='H'){ SFX.drop(); p.hard(); }
  else if(a==='S') p.useSpecial();
}
const reps={};
function press(p,a,key){
  act(p,a);
  if(a==='L'||a==='R'||a==='D'){
    release(key);
    const r=reps[key]={};
    r.t=setTimeout(()=>{ r.i=setInterval(()=>act(p,a), a==='D'?35:45); }, a==='D'?60:150);
  }
}
function release(key){ const r=reps[key]; if(r){ clearTimeout(r.t); clearInterval(r.i); delete reps[key]; } }
function releaseAll(){ Object.keys(reps).forEach(release); document.querySelectorAll('.pad.on').forEach(b=>b.classList.remove('on')); }

const KEYS={KeyA:[1,'L'],KeyD:[1,'R'],KeyW:[1,'U'],KeyS:[1,'D'],Space:[1,'H'],KeyE:[1,'S'],
  ArrowLeft:[2,'L'],ArrowRight:[2,'R'],ArrowUp:[2,'U'],ArrowDown:[2,'D'],Enter:[2,'H'],NumpadEnter:[2,'H'],Slash:[2,'S'],ShiftRight:[2,'S']};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  if(e.code==='Escape'||e.code==='KeyP'){ if(state==='playing') pause(); else if(state==='paused') actions.resume(); return; }
  if(state!=='playing'&&(e.code==='Enter'||e.code==='Space')&&primaryAction){ e.preventDefault(); primaryAction(); return; }
  const k=KEYS[e.code]; if(!k) return;
  e.preventDefault(); if(e.repeat) return;
  const p = (mode==='cpu'||mode==='online') ? P2 : (k[0]===1?P1:P2); // 컴퓨터 대결 땐 두 키 세트 모두 내 판 조작
  press(p,k[1],e.code);
});
addEventListener('keyup',e=>release(e.code));
addEventListener('blur',releaseAll);

players.forEach(p=>{
  p.root.querySelectorAll('.pad').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();
      try{ b.setPointerCapture(e.pointerId); }catch(_){}
      const key='t'+p.id+b.dataset.a+e.pointerId; b._key=key; b.classList.add('on');
      press(p,b.dataset.a,key);
    });
    const up=()=>{ b.classList.remove('on'); if(b._key){ release(b._key); b._key=null; } };
    b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
});
document.addEventListener('touchmove',e=>{ if(!e.target.closest('.picker,.card')) e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ===== 루프 ===== */
function fitAll(){ applyMode(); players.forEach(p=>{ p.applyOpt(); }); players.forEach(p=>p.fit()); }
addEventListener('resize',fitAll);
deskMQ.addEventListener('change',fitAll);
if(window.ResizeObserver) new ResizeObserver(()=>players.forEach(p=>p.fit())).observe($('#app'));
let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last); last=t;
  if(state==='playing'){
    elapsed+=dt;
    const lvl=Math.floor(elapsed/25000)+1;
    const interval=Math.max(90,800*Math.pow(0.84,lvl-1));
    setLv(lvl); Music.tempo(lvl);
    if(cpu) cpu.update(dt);
    players.forEach(p=>{ if(p.remote){ if(p.flashT>0) p.flashT-=dt; } else p.update(dt,interval); });
    if(mode==='online') Net.tick(dt);
  }
  players.forEach(p=>p.draw());
  requestAnimationFrame(loop);
}
P1.setChar(CHARS[0]); P2.setChar(CHARS[1]);
fitAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
menu();
requestAnimationFrame(loop);
</script>
</body>
</html>
